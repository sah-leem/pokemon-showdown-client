<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Redirecting... - MMO Showdown</title>
<style>
	* { margin: 0; padding: 0; box-sizing: border-box; }
	body {
		background: #1a1a2e;
		background-image: url('/fx/squirtlesquad.png');
		background-size: cover;
		background-position: center;
		background-repeat: no-repeat;
		background-attachment: fixed;
		color: #e0e0e0;
		font-family: Verdana, Geneva, sans-serif;
		min-height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
	}
	body::before {
		content: '';
		position: fixed;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		background: rgba(10, 10, 30, 0.75);
		z-index: 0;
	}
	.container {
		position: relative;
		z-index: 1;
		background: rgba(22, 33, 62, 0.92);
		border: 1px solid #344;
		border-radius: 8px;
		padding: 32px;
		max-width: 600px;
		width: 90%;
		box-shadow: 0 4px 24px rgba(0,0,0,0.5);
		backdrop-filter: blur(8px);
	}
	h1 {
		font-size: 18px;
		color: #f5f5f5;
		margin-bottom: 16px;
	}
	p {
		font-size: 13px;
		line-height: 1.6;
		margin-bottom: 16px;
		color: #ccc;
	}
	.url-display {
		background: rgba(15, 26, 48, 0.9);
		border: 1px solid #344;
		border-radius: 4px;
		padding: 12px;
		margin-bottom: 20px;
		word-break: break-all;
		font-family: monospace;
		font-size: 13px;
		color: #6cb6ff;
	}
	.buttons {
		display: flex;
		gap: 12px;
		flex-wrap: wrap;
	}
	a.btn {
		display: inline-block;
		padding: 10px 24px;
		border-radius: 4px;
		text-decoration: none;
		font-size: 13px;
		font-weight: bold;
		cursor: pointer;
		transition: opacity 0.15s;
	}
	a.btn:hover { opacity: 0.85; }
	a.btn-primary {
		background: #4a90d9;
		color: #fff;
	}
	a.btn-secondary {
		background: #344;
		color: #ccc;
	}
	.warning {
		font-size: 12px;
		color: #999;
		margin-top: 16px;
	}
</style>
</head>
<body>
<div class="container">
	<h1>You are about to leave MMO Showdown</h1>
	<p>You're about to visit an external link. Make sure you trust this website before continuing.</p>
	<div class="url-display" id="target-url">Loading...</div>
	<div class="buttons">
		<a class="btn btn-primary" id="continue-btn" href="#">Continue</a>
		<a class="btn btn-secondary" href="https://mmoshowdown.cc/">Go Back</a>
	</div>
	<p class="warning">MMO Showdown is not responsible for the content of external websites.</p>
</div>
<script>
(function() {
	var params = new URLSearchParams(window.location.search);
	var uri = params.get('uri');
	var display = document.getElementById('target-url');
	var btn = document.getElementById('continue-btn');

	if (!uri) {
		display.textContent = 'No URL provided.';
		btn.style.display = 'none';
		return;
	}

	// Basic sanitization - only allow http/https
	if (!/^https?:\/\//i.test(uri)) {
		uri = 'http://' + uri;
	}

	display.textContent = uri;
	btn.href = uri;
})();
</script>
</body>
</html>
